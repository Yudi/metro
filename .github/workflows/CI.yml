name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: false
  NX_NO_CLOUD: true

jobs:
  verify:
    name: Nx affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Forked PRs cannot receive PRIVATE_SUBMODULE_TOKEN. They still run
          # the public lint, test, build, E2E, and container-image checks.
          submodules: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bunx nx run metro-backend:prisma-generate

      - name: Verify rail integration protobuf contract
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: node tools/verify-rail-integration-contract.mjs

      - name: Verify Rust importer
        run: |
          cargo fmt --manifest-path dataset-handling/Cargo.toml --check
          cargo clippy --manifest-path dataset-handling/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path dataset-handling/Cargo.toml --locked
          cargo build --manifest-path dataset-handling/Cargo.toml --release --locked

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Lint affected projects
        run: bunx nx affected -t lint --parallel=3

      - name: Test affected projects
        run: bunx nx affected -t test --configuration=ci --parallel=3

      - name: Build affected projects
        run: bunx nx affected -t build --parallel=3

      - name: Build affected Storybooks
        run: bunx nx affected -t build-storybook --parallel=1

  browser-e2e:
    name: Browser smoke flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser product flows
        run: bunx nx run-many -t e2e -p metro-frontend-e2e,metro-frontend-lite-e2e --parallel=1

  production-images:
    name: Production image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - metro-backend
          - metro-frontend
          - metro-frontend-lite

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --file apps/${{ matrix.app }}/Dockerfile --tag metro-${{ matrix.app }}:ci .

      - name: Verify non-root runtime
        run: |
          user="$(docker image inspect metro-${{ matrix.app }}:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "0:0"
          test "$user" != "root"

  compose:
    name: Render Compose deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Render deployment
        run: |
          touch docker/.env
          docker compose --env-file /dev/null --file docker/docker-compose.yml config --quiet
