<app-dialog-header
  icon="directions_bus"
  [title]="stop().name"
  [description]="
    'Ponto de ônibus · ID: ' +
    stopDisplayId +
    (stop().platformCode ? ' · Plataforma: ' + stop().platformCode : '')
  "
/>

<mat-dialog-content class="stop-content">
  @if (stopDescription()) {
    <p class="stop-description">{{ stopDescription() }}</p>
    <mat-divider></mat-divider>
  }

  @if (routesLoading()) {
    <p class="routes-state" role="status" aria-live="polite">Consultando linhas do ponto…</p>
  } @else if (routesError()) {
    <p class="routes-state" role="status">Não foi possível consultar as linhas deste ponto.</p>
  }

  <!-- Real-time arrivals -->
  <div class="arrivals-section">
    <app-stop-arrivals
      [stop]="stop()"
      [routes]="routesSortedByFavorite()"
      [selectedRoutes]="data.selectedRoutes"
      [showMapActions]="showMapActions"
      (selectRoute)="selectRouteById($event)"
    ></app-stop-arrivals>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-icon-button
    class="favorite-button"
    [class.favorited]="isFavorite()"
    (click)="toggleFavorite()"
    (mouseenter)="setFavoriteHover(true)"
    (mouseleave)="setFavoriteHover(false)"
    [attr.aria-label]="
      isFavorite() ? 'Remover dos favoritos' : 'Adicionar aos favoritos'
    "
  >
    <mat-icon>{{ favoriteIcon() }}</mat-icon>
  </button>
  @if (!panelRef && !embedded()) {
    <button mat-button (click)="close()">Fechar</button>
  }
  @if (showMapActions) {
    <button mat-raised-button color="primary" (click)="addToSelection()">
      Adicionar à seleção
    </button>
  }
</mat-dialog-actions>
