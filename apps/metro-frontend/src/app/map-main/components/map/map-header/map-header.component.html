<header class="map-header">
  @if (showPrimaryControls()) {
    <div class="primary-actions">
      <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic"
        class="search-field"
        [class.is-search-open]="searchOpen()"
      >
        <mat-label>Buscar linhas e paradas</mat-label>
        <input
          matInput
          type="search"
          #searchInput
          [formControl]="searchControl()"
          [errorStateMatcher]="searchErrorMatcher"
          aria-haspopup="dialog"
          [attr.aria-expanded]="searchOpen()"
          [attr.aria-invalid]="searchError() ? 'true' : null"
          autocomplete="off"
        />
        <button
          matIconButton
          matSuffix
          class="search-action"
          type="button"
          aria-label="Pesquisar linhas e paradas"
          matTooltip="Pesquisar linhas e paradas"
          matTooltipPosition="above"
          (click)="searchClick.emit()"
        >
          <mat-icon aria-hidden="true">search</mat-icon>
        </button>
        @if (searchError()) {
          <mat-error>{{ searchError() }}</mat-error>
        }
      </mat-form-field>

      <span
        class="location-button-container"
        [matTooltip]="locationMessage()"
        matTooltipPosition="above"
        [attr.title]="isLocationActionDisabled() ? locationMessage() : null"
      >
        <button
          matIconButton
          type="button"
          class="location-button"
          [class.is-visible]="userLocationVisible()"
          (click)="userLocationToggle.emit()"
          [disabled]="isLocationActionDisabled()"
          aria-label="Minha localização"
          [attr.aria-description]="locationMessage()"
          [attr.aria-pressed]="userLocationVisible()"
          [attr.aria-busy]="isRequestingLocation() ? 'true' : null"
        >
          @if (isRequestingLocation()) {
            <mat-spinner diameter="20" aria-hidden="true"></mat-spinner>
          } @else {
            <mat-icon aria-hidden="true">my_location</mat-icon>
          }
        </button>
      </span>
    </div>
  }

  @if (showSecondaryControls()) {
    <div class="secondary-actions">
      <button
        matIconButton
        type="button"
        class="icon-action"
        (click)="layersClick.emit()"
        matTooltip="Configurar camadas"
        matTooltipPosition="below"
        aria-label="Camadas"
        [attr.aria-pressed]="layersOpen()"
      >
        <mat-icon aria-hidden="true">layers</mat-icon>
      </button>

      <button
        matButton
        type="button"
        class="options-button"
        [matMenuTriggerFor]="optionsMenu"
        matTooltip="Opções do mapa"
        matTooltipPosition="below"
        aria-label="Opções"
      >
        <mat-icon aria-hidden="true">tune</mat-icon>
        <span>Opções</span>
      </button>
    </div>
  }
</header>

<mat-menu #optionsMenu="matMenu" aria-label="Opções do mapa">
  <button mat-menu-item type="button" (click)="addressSearchClick.emit()">
    <mat-icon aria-hidden="true">search</mat-icon>
    <span>Buscar endereço</span>
  </button>

  <button mat-menu-item type="button" (click)="centerClick.emit()">
    <mat-icon aria-hidden="true">location_city</mat-icon>
    <span>Centralizar em {{ cityContext.city().name }}</span>
  </button>

  <mat-divider></mat-divider>

  <button
    mat-menu-item
    type="button"
    aria-label="Enquadrar itens visíveis"
    [disabled]="!hasFeatures()"
    (click)="fitClick.emit()"
  >
    <mat-icon aria-hidden="true">zoom_out_map</mat-icon>
    <span>Enquadrar itens visíveis</span>
  </button>

  @if (hasSelections()) {
    <button
      mat-menu-item
      type="button"
      (click)="clearClick.emit()"
      aria-label="Limpar todas as seleções"
    >
      <mat-icon aria-hidden="true">clear_all</mat-icon>
      <span>Limpar seleções</span>
    </button>
  }
</mat-menu>
