<mat-toolbar class="footer-toolbar">
  <mat-toolbar-row class="footer-content">
    <span class="footer-text">{{ cityContext.city().siteTitle }}</span>
    <span class="footer-links">
      @for (item of footerLinks; track item.name) {
        @if (item.external) {
          <a [href]="item.link" class="footer-link" rel="noopener">
            {{ item.name }}
          </a>
        } @else {
          <a [routerLink]="cityContext.path(item.link)" class="footer-link">
            {{ item.name }}
          </a>
        }
      }
    </span>
  </mat-toolbar-row>
</mat-toolbar>
