syntax = "proto3";

package metro.rail.integration.v1;

service RailIntegrationService {
  rpc Check(ReadinessRequest) returns (ReadinessResponse);
  rpc FetchNextTrains(LineStationRequest) returns (NextTrainsResponse);
  rpc GetStationName(LineStationRequest) returns (StationNameResponse);
  rpc GetStationCodes(LineRequest) returns (StationCodesResponse);
  rpc GetStationByName(StationByNameRequest) returns (StationLookupResponse);
  rpc GetVehiclesForLine(VehiclesRequest) returns (VehiclesResponse);
  rpc GetAvailableSpecialRailServices(ReadinessRequest) returns (SpecialRailServicesResponse);
  rpc FetchHeadwayObservations(LineStationRequest) returns (HeadwayObservationsResponse);
  rpc FetchRailStatusLines(ReadinessRequest) returns (RailStatusLinesResponse);
  rpc FetchSpecialRailStatusLines(ReadinessRequest) returns (SpecialRailStatusLinesResponse);
}

message ReadinessRequest {}

message ReadinessResponse {
  bool ready = 1;
}

message LineRequest {
  string line_code = 1;
}

message LineStationRequest {
  string line_code = 1;
  string station_code = 2;
}

message StationByNameRequest {
  string line_code = 1;
  string station_name = 2;
}

message TrainCarOccupancy {
  int32 position = 1;
  int32 load_level = 2;
  optional bool occupancy_available = 3;
  bool wheelchair_accessible = 4;
}

message NextTrainArrival {
  string destination_code = 1;
  string destination_name = 2;
  string train_current_station_name = 3;
  string arrival_time = 4;
  optional bool is_at_platform = 5;
  optional bool is_train_stopped = 6;
  optional string train_position_status = 7;
  optional string train_near_station_name = 8;
  repeated TrainCarOccupancy cars = 9;
  bool has_is_at_platform = 10;
  bool has_is_train_stopped = 11;
  optional string train_last_passed_station_name = 12;
}

message NextTrainsResponse {
  bool success = 1;
  repeated NextTrainArrival trains = 2;
  bool is_api_error = 3;
}

message StationNameResponse {
  optional string station_name = 1;
}

message StationCodesResponse {
  repeated string station_codes = 1;
}

message StationLookupResponse {
  bool found = 1;
  string station_code = 2;
  string station_name = 3;
  double latitude = 4;
  double longitude = 5;
}

message VehiclePosition {
  string id = 1;
  string prefix = 2;
  double lat = 3;
  double lng = 4;
  double bearing = 5;
  bool wheelchair = 6;
  bool climatized = 7;
  int64 last_update = 8;
  double average_speed = 9;
  int32 stop_sequence = 10;
  optional string destination = 11;
  optional bool estimated = 12;
  optional int64 valid_until = 13;
  optional string estimated_position_description = 14;
}

message MapCoordinate {
  double lat = 1;
  double lng = 2;
}

message MapStation {
  string code = 1;
  double lat = 2;
  double lng = 3;
}

message MapPath {
  repeated MapCoordinate points = 1;
}

message RailVehicleMapContext {
  repeated MapStation stations = 1;
  repeated MapPath paths = 2;
}

message VehiclesRequest {
  string line_code = 1;
  optional RailVehicleMapContext map_context = 2;
}

message VehiclesResponse {
  repeated VehiclePosition vehicles = 1;
}

message SpecialRailServiceStation {
  string station_code = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
}

message SpecialRailService {
  string code = 1;
  string name = 2;
  string color_hex = 3;
  string text_color_hex = 4;
  repeated SpecialRailServiceStation stations = 5;
}

message SpecialRailServicesResponse {
  repeated SpecialRailService services = 1;
}

message HeadwayObservation {
  string train_key = 1;
  string direction_name = 2;
  int32 seconds_to_station = 3;
}

message HeadwayObservationsResponse {
  repeated HeadwayObservation observations = 1;
}

message RailStatusLine {
  int32 code = 1;
  string color_name = 2;
  string color_hex = 3;
  string line = 4;
  string status_code = 5;
  string status_label = 6;
  string status_color = 7;
  optional string description = 8;
  optional string incident_category = 9;
  optional string detail = 10;
}

message RailStatusLinesResponse {
  repeated RailStatusLine lines = 1;
}

message SpecialRailStatusLine {
  string code = 1;
  string status_code = 2;
  string status_label = 3;
  string status_color = 4;
  optional string description = 5;
}

message SpecialRailStatusLinesResponse {
  repeated SpecialRailStatusLine lines = 1;
}
