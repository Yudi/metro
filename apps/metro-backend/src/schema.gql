  name: String!
  stations: [SpecialRailServiceStation!]!
  textColorHex: String!
}

"""
Station served by a runtime-discovered special service
"""
type SpecialRailServiceStation {
  latitude: Float!
  longitude: Float!
  name: String!
  stationCode: String!
}

"""
Next trains arriving at a station
"""
type StationNextTrains {
  """
  When the data was last fetched
  """
  fetchedAt: DateTime

  """
  Average headway per direction (if available)
  """
  headway: [DirectionHeadwayEntity!]

  """
  Line code (L4, L8, or L9)
  """
  lineCode: String!

  """
  Whether operation is closed and no station arrival data remains relevant
  """
  operationClosed: Boolean

  """
  Whether a special service has no scheduled departure within its operating margin
  """
  outOfSchedule: Boolean

  """
  Station code
  """
  stationCode: String!

  """
  Station name
  """
  stationName: String!

  """
  List of arriving trains
  """
  trains: [NextTrainArrival!]!
}

type StopFullData {
  """
  Full data for all routes passing through this stop
  """
  routes: [RouteFullData!]!

  """
  The stop information
  """
  stop: BusStop!
}

type StopRoutes {
  routeShortNames: [String!]!
  stopId: String!
}

input StopSearchInput {
  bounds: BoundingBoxInput
  limit: Float
  searchTerm: String
}

type Trip {
  directionId: Int!
  id: ID!
  routeId: String!
  serviceId: String!
  shapeId: String!
  tripHeadsign: String!
  tripId: String!
}
